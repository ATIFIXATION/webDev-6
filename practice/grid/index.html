<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .container {
        border: 2px solid black;
        display: grid;
        grid-template-columns: 120px 190px;
        grid-template-rows: 100px 100px 100px 100px;
      }

      .itm {
        border: 5px solid black;
        height: 55px;
        width: 55px;
      }

      .item-4 {
        grid-column: 1/2;

        grid-row: 1/2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="itm">1</div>
      <div class="itm">2</div>
      <div class="itm">3</div>
      <div class="itm.item-4">4</div>
      <div class="itm">5</div>
    </div>
  </body>
</html>
