<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Currency Exchange Calculator</title>

  <link rel="stylesheet" href="style.css" />

 
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
  />
</head>
<body>

  <video autoplay muted loop playsinline class="bg-video">
    <source src="currency.mp4" type="video/mp4">
  </video>


  <div class="overlay"></div>


  <div class="container">

    <h1>Currency Converter</h1>


    <div class="input-box">
      <label>Enter Amount</label>
      <input type="number" id="amount" placeholder="Enter amount" value="1">
    </div>

    <!-- Currency Selection -->
    <div class="currency-container">

      <!-- From -->
      <div class="currency-box">
        <p>From</p>

        <div class="select-box">
          <img
            src="https://flagsapi.com/US/flat/64.png"
            id="fromFlag"
          />

          <select id="fromCurrency">
            <option value="USD">USD</option>
            <option value="INR">INR</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="JPY">JPY</option>
          </select>
        </div>
      </div>

  
      <div class="exchange-icon">
        <i class="fa-solid fa-arrow-right-arrow-left"></i>
      </div>

      <div class="currency-box">
        <p>To</p>

        <div class="select-box">
          <img
            src="https://flagsapi.com/IN/flat/64.png"
            id="toFlag"
          />

          <select id="toCurrency">
            <option value="INR">INR</option>
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="GBP">GBP</option>
            <option value="JPY">JPY</option>
          </select>
        </div>
      </div>

    </div>

 
    <div class="result" id="result">
      1 USD = 83 INR
    </div>

    <button id="convertBtn">Convert Currency</button>

  </div>

  <script src="script.js"></script>
</body>
</html>
