<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Feedback | Cravings</title>

  <!-- bootstrap css -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- my css -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- navbar -->
  <nav class="navbar navbar-expand-lg navbar-cravings sticky-top">
    <div class="container">

      <!-- logo -->
      <a class="navbar-brand fw-bold d-flex align-items-center gap-2" href="index.html">
        <i class="bi bi-fire"></i> Cravings
      </a>

      <!-- toggle button -->
      <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- links -->
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav me-auto ms-3 gap-1">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="order-now.html">Order Now</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>

        <!-- login register -->
        <div class="d-flex gap-3 align-items-center">
          <a href="login.html" class="text-white">Login</a>
          <a href="register.html" class="btn-register">Register</a>
        </div>
      </div>
    </div>
  </nav>

  <!-- main section -->
  <div class="fullscreen-bg d-flex justify-content-end pe-md-5"
       style="background:url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=1600&q=80') center/cover no-repeat;
              background-color:rgba(0,0,0,0.4);
              background-blend-mode:multiply;">

    <!-- form -->
    <div class="form-card me-md-4" style="max-width:420px;">
      <h4>Share Feedback</h4>
      <p class="text-secondary small mb-4">Tell us your experience.</p>

      <!-- name input -->
      <div class="mb-3">
        <label class="form-label small fw-semibold">Full Name</label>
        <input type="text" class="form-control" placeholder="Enter your name">
      </div>

      <!-- email input -->
      <div class="mb-3">
        <label class="form-label small fw-semibold">Email</label>
        <input type="email" class="form-control" placeholder="Enter your email">
      </div>

      <!-- category -->
      <div class="mb-3">
        <label class="form-label small fw-semibold">Category</label>
        <select class="form-select">
          <option selected disabled>Select category</option>
          <option>Food Quality</option>
          <option>Delivery</option>
          <option>Website/App</option>
          <option>Support</option>
          <option>Pricing</option>
        </select>
      </div>

      <!-- rating stars -->
      <div class="mb-3">
        <label class="form-label small fw-semibold d-block">Rating</label>
        <div class="d-flex gap-1">
          <i class="bi bi-star"></i>
          <i class="bi bi-star"></i>
          <i class="bi bi-star"></i>
          <i class="bi bi-star"></i>
          <i class="bi bi-star"></i>
        </div>
      </div>

      <!-- feedback box -->
      <div class="mb-4">
        <label class="form-label small fw-semibold">Your Feedback</label>
        <textarea class="form-control" rows="4" placeholder="Write your feedback"></textarea>
      </div>

      <!-- submit -->
      <button class="btn btn-primary-cravings w-100">Submit</button>
    </div>
  </div>

  <!-- footer -->
  <footer class="footer-cravings pt-5 pb-3">
    <div class="container">

      <!-- row -->
      <div class="row g-4">

        <!-- brand -->
        <div class="col-md-4 col-lg-2">
          <div class="fw-bold text-white d-flex align-items-center gap-2 mb-2">
            <i class="bi bi-fire"></i> Cravings
          </div>
          <p class="small" style="opacity:0.7;">
            Good food, delivered fast.
          </p>
        </div>

        <!-- links -->
        <div class="col-6 col-md-4 col-lg-2">
          <h6 class="text-white mb-3">Quick Links</h6>
          <ul class="list-unstyled">
            <li><a href="index.html">Home</a></li>
            <li class="mt-2"><a href="about.html">About</a></li>
            <li class="mt-2"><a href="order-now.html">Order</a></li>
          </ul>
        </div>

        <!-- support -->
        <div class="col-6 col-md-4 col-lg-3">
          <h6 class="text-white mb-3">Support</h6>
          <ul class="list-unstyled">
            <li><a href="feedback.html">Feedback</a></li>
            <li class="mt-2"><a href="contact.html">Contact</a></li>
          </ul>
        </div>

      </div>

      <!-- bottom -->
      <hr class="mt-4">

      <div class="d-flex justify-content-between small" style="opacity:0.7;">
        <span>© 2026 Cravings</span>
        <div>
          <a href="privacy-policy.html">Privacy</a> |
          <a href="terms-of-service.html">Terms</a>
        </div>
      </div>

    </div>
  </footer>

  <!-- js -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
