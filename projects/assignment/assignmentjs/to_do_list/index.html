<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To Do List</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <header class="bg-primary text-light p-3 text-center fs-3">
      To Do List
    </header>

    <main>
      <div class="container rounded border shadow my-4 p-4">
        <div class="d-flex gap-3">
          <input
            type="text"
            id="newtask"
            placeholder="Add a new task"
            class="form-control"
          />

          <button class="btn btn-primary" onclick="addnewtask()">
            Add Task
          </button>
        </div>

        <ol id="tasklist" class="mt-4">
          <li class="my-3">
            <div
              class="d-flex justify-content-between align-items-center"
            >
              <span>Task 1</span>

              <button
                class="btn btn-danger d-flex gap-2 align-items-center justify-content-center"
              >
                <i class="bi bi-trash"></i>
                <span>Delete</span>
              </button>
            </div>
          </li>
        </ol>
      </div>
    </main>

   
  </body>
</html>
