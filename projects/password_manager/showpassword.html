<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Manager</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-light text-dark">

    <main class="container mt-5">
      <header class="bg-primary text-white p-3 rounded">
        <h2 class="text-center mb-0 align-text-left align-content-left">Password Manager</h2>
        
     
      </header>
      






     
      </header>
      

 <div class="align-content-center justify-content-center p-auto d-flex  ">
        <a href="text-decoration-none text-white">add new password</a>

        <a href="text-decoration-none text-white">view saved passwords</a>
      </div>














      <div class="w-50 mx-auto rounded border p-4 bg-primary-subtle"> 
        <form id="passwordForm" itemid="passform">
          <div class="mb-3">
            <input
              type="text"
              name="sitename"
              id="sitename"
              placeholder="Enter Site Name"
              class="form-control"
              required
            />
          </div>

          <div class="mb-3">
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Enter Username"
              class="form-control"
              required
            />
          </div>
          
          <div class="mb-4">
            <input
              type="password"
              name="password"
              id="password"
              placeholder="Enter Password"
              class="form-control"
              required
            />
          </div>

          <div class="d-flex justify-content-center gap-2">
            <button type="submit" class="btn btn-outline-primary">Save</button>
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
            <button type="button" id="clearBtn" class="btn btn-outline-danger">Clear</button>
          </div>
        </form>
      </div>
    </main>

   
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <script src="script.js"></script>
    <script src="script.js"></script>
  </body>
</html>
