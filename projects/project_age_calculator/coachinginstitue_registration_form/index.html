<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Coaching Institute Registration Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <h1 class="bg-info text-center p-2">
      institute registration form
    </h1>

    <div
      class="main d-flex flex-column mx-auto w-50 p-5 border border-dark border-2 bg-info-subtle shadow-sm "
    >
      <form id="registrationform">
        <!-- Personal Information -->

        <div class="personalinformation border border-1 border-success-subtle p-3 rounded">
          <label for="fullname ">Enter your name :</label>

          <input
            type="text"
            name="fullname"
            id="fullname"
            placeholder="enter full name"
            class="form-control w-75"
          />

          <br />

          <label for="email">Enter your email id :</label>

          <input
            type="email"
            name="email"
            id="email"
            placeholder="enter email"
            class="form-control w-75"
          />

          <br />

          <label for="phone">Enter your phone number :</label>

          <input
            type="text"
            name="phone"
            id="phone"
            placeholder="enter phone number"
            class="form-control w-75"
          />

          <br />

          <label for="dob">Enter your date of birth :</label>

          <input
            type="date"
            name="dob"
            id="dob"
            class="form-control w-75"
          />
        </div>

        <br />

        <!-- Academic Details -->

        <div class="academicdetails">
          <label for="qualifications">
            Last completed qualification :
          </label>

          <select
            class="form-control w-75"
            name="qualifications"
            id="qualifications"
          >
            <option value="SELECT">SELECT</option>
            <option value="10th">10th</option>
            <option value="12th">12th</option>
            <option value="graduation">Graduation</option>
          </select>

          <br />

          <label for="grades">
            Enter your percentage or grade :
          </label>

          <input
            type="text"
            id="grades"
            placeholder="Enter percentage or grade"
            class="form-control w-75"
          />
        </div>

        <br />

        <!-- Course Information -->

        <div class="courseinformation">
          <label for="courses">
            Select course you want to enroll in :
          </label>

          <select
            class="form-control w-75"
            name="courses"
            id="courses"
          >
            <option value="SELECT">SELECT</option>
            <option value="webdevelopment">
              Web Development
            </option>
            <option value="datascience">
              Data Science
            </option>
            <option value="androiddevelopment">
              Android Development
            </option>
            <option value="cybersecurity">
              Cyber Security
            </option>
          </select>

          <br />

          <label for="batches">
            Select batch :
          </label>

          <select
            class="form-control w-75"
            name="batches"
            id="batches"
          >
            <option value="SELECT">SELECT</option>
            <option value="batch1">
              Batch 1 (8am - 10am)
            </option>
            <option value="batch2">
              Batch 2 (10am - 12pm)
            </option>
            <option value="batch3">
              Batch 3 (6pm - 8pm)
            </option>
          </select>
        </div>

        <br />

        <!-- Address -->

        <div class="addresssection">
          <label for="fulladdress">
            Enter your address :
          </label>

          <input
            type="text"
            name="address"
            id="fulladdress"
            placeholder="enter address"
            class="form-control w-75"
          />

          <br />

          <label for="city">
            Enter your city :
          </label>

          <input
            type="text"
            name="city"
            id="city"
            placeholder="enter city"
            class="form-control w-75"
          />

          <br />

          <label for="pincode">
            Enter your pincode :
          </label>

          <input
            type="text"
            name="pincode"
            id="pincode"
            placeholder="enter pincode"
            class="form-control w-75"
          />
        </div>

        <br />

        <!-- Guardian Details -->

        <div class="guardiandetails">
          <label for="guardianname">
            Enter guardian's name :
          </label>

          <input
            type="text"
            name="guardianname"
            id="guardianname"
            placeholder="enter guardian's name"
            class="form-control w-75"
          />

          <br />

          <label for="guardianphone">
            Enter guardian's contact number :
          </label>

          <input
            type="text"
            name="guardianphone"
            id="guardianphone"
            placeholder="enter guardian's phone number"
            class="form-control w-75"
          />
        </div>

        <br />

        <!-- Additional Information -->

        <div class="additionalinformation">
          <label for="hearaboutus">
            How did you hear about us?
          </label>

          <select
            class="form-control w-75"
            name="hearaboutus"
            id="hearaboutus"
          >
            <option value="SELECT">SELECT</option>
            <option value="friends">Friends</option>
            <option value="onlinead">Online Ad</option>
            <option value="newspaper">Newspaper</option>
            <option value="socialmedia">Social Media</option>
            <option value="other">Other</option>
          </select>
        </div>

        <br />

        <label for="specialrequirements">
          Special requirements :
        </label>

        <textarea
          name="specialrequirements"
          id="specialrequirements"
          class="form-control w-75"
          placeholder="enter any special requirements"
        ></textarea>

        <br />

        <button
          type="submit"
          class="btn btn-primary"
        >
          Submit Form
        </button>
      </form>
    </div>

    <script src="script.js"></script>
  </body>
</html>
