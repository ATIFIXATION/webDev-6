<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Weather App</title>

  <style>

    body{
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: whitesmoke;
    }

    .card{
      width: 250px;
      min-height: 300px;
      background-color: #d8c26a;
      border: 1px solid black;
      border-radius: 10px;
      padding: 20px;
    }

    input{
      width: 100%;
      height: 35px;
      font-size: 18px;
      margin-bottom: 10px;
    }

    button{
      width: 100%;
      height: 35px;
      font-size: 18px;
      cursor: pointer;
    }

    .result{
      margin-top: 30px;
      background-color: #e5e5e5;
      padding: 10px;
      border-radius: 10px;
      font-size: 22px;
    }

  </style>

</head>

<body>

  <div class="card">

    <input
      type="text"
      id="cityName"
      placeholder="Enter city"
    >

    <button onclick="getWeather()">
      Get Weather
    </button>
    <br/>

    <div class="result">

      <p id="temp">
        temp:
      </p>

     

    </div>

  </div>

  <script src="Script.js"></script>

</body>
</html>
