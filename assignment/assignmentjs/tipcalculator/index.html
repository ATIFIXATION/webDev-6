<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tip Calculator</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container d-flex justify-content-center align-items-center vh-100">
      <div class="calculator-box">

        <div class="heading text-center">
          <h2>TIP CALCULATOR</h2>
        </div>

        <div class="content p-4">

          <div class="mb-4">
            <label class="form-label">Bill Amount</label>

            <div class="input-group">
              <input
                type="number"
                id="billAmount"
                class="form-control"
                placeholder="Amount to be paid"
              />
              <span class="input-group-text">₹</span>
            </div>
          </div>

   
          <div class="mb-4">
            <label class="form-label">How was the service?</label>

            <select id="service" class="form-select">
              <option value="">Select</option>
              <option value="0.25">25% - Top Notch</option>
              <option value="0.20">20% - Excellent</option>
              <option value="0.15">15% - Good</option>
              <option value="0.10">10% - Bad</option>
              <option value="0.05">5% - Worst</option>
            </select>
          </div>


          <div class="mb-4">
            <label class="form-label">Total number of persons</label>

            <input
              type="number"
              id="persons"
              class="form-control"
              placeholder="Number of people sharing the bill"
            />
          </div>

        
          <button class="btn btn-info text-white px-4 py-2" id="calculateBtn">
            Calculate
          </button>

          <div class="result mt-4 text-center" id="result">
            <h4>Each Person Pays</h4>
            <h2>₹ <span id="amount">0</span></h2>
          </div>
        </div>
      </div>
    </div>

    
    <script src="script.js"></script>
  </body>
</html>
