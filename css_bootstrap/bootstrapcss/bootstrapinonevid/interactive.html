<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bootstrap Revision</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f5f5f5;
    }
    .hero {
      height: 60vh;
      background: linear-gradient(to right, #0d6efd, #6610f2);
      color: white;
    }
  </style>
</head>
<body>

<!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">AtifSite</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Features</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- 🔹 HERO SECTION -->
<div class="hero d-flex justify-content-center align-items-center text-center">
  <div>
    <h1 class="display-4">Learn Bootstrap Fast</h1>
    <p class="lead">One page revision</p>
    <button class="btn btn-light" data-bs-toggle="modal" data-bs-target="#myModal">
      Open Modal
    </button>
  </div>
</div>

<!-- 🔹 GRID SYSTEM -->
<div class="container my-5">
  <h2 class="text-center mb-4">Grid System</h2>
  <div class="row">
    <div class="col-md-4 bg-primary text-white p-3">Column 1</div>
    <div class="col-md-4 bg-success text-white p-3">Column 2</div>
    <div class="col-md-4 bg-danger text-white p-3">Column 3</div>
  </div>
</div>

<!-- 🔹 CARDS -->
<div class="container my-5">
  <h2 class="text-center mb-4">Cards</h2>
  <div class="row">

    <div class="col-md-4">
      <div class="card shadow">
        <img src="https://picsum.photos/300" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">Card 1</h5>
          <p class="card-text">Example text</p>
          <button class="btn btn-primary">Read More</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow">
        <img src="https://picsum.photos/301" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">Card 2</h5>
          <p class="card-text">Example text</p>
          <button class="btn btn-success">Read More</button>
        </div>
      </div>
    </div>

    <div class="col-md-4">
      <div class="card shadow">
        <img src="https://picsum.photos/302" class="card-img-top">
        <div class="card-body">
          <h5 class="card-title">Card 3</h5>
          <p class="card-text">Example text</p>
          <button class="btn btn-danger">Read More</button>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- 🔹 CAROUSEL -->
<div class="container my-5">
  <h2 class="text-center mb-4">Carousel</h2>

  <div id="slider" class="carousel slide">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://picsum.photos/800/300?1" class="d-block w-100">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/800/300?2" class="d-block w-100">
      </div>
      <div class="carousel-item">
        <img src="https://picsum.photos/800/300?3" class="d-block w-100">
      </div>
    </div>

    <button class="carousel-control-prev" data-bs-target="#slider" data-bs-slide="prev">
      <span class="carousel-control-prev-icon"></span>
    </button>

    <button class="carousel-control-next" data-bs-target="#slider" data-bs-slide="next">
      <span class="carousel-control-next-icon"></span>
    </button>
  </div>
</div>

<!-- 🔹 FORM -->
<div class="container my-5">
  <h2 class="text-center mb-4">Form</h2>

  <form class="bg-light p-4 rounded shadow">
    <div class="mb-3">
      <label>Name</label>
      <input type="text" class="form-control">
    </div>

    <div class="mb-3">
      <label>Email</label>
      <input type="email" class="form-control">
    </div>

    <div class="mb-3">
      <label>Message</label>
      <textarea class="form-control"></textarea>
    </div>

    <button class="btn btn-primary w-100">Submit</button>
  </form>
</div>

<!-- 🔹 MODAL -->
<div class="modal fade" id="myModal">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Bootstrap Modal</h5>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">
        This is a popup using Bootstrap!
      </div>

      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>

    </div>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
